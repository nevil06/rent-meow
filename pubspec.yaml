name: mymanager
description: "MyManager - Landlord & Tenant Property Management Flutter Application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Core State & Architecture
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0
  supabase_flutter: ^2.8.4

  # Styling & UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Features
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
